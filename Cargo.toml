[package]
name = "antarez-eas-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Generic async Rust client for the Ethereum Attestation Service (EAS)"

[dependencies]
alloy = { version = "=1.6.3", features = ["full"] }
tokio = { version = "=1.53.1", features = ["full"] }
# Exact version, kept aligned with the workspace path-dependency family
# (sigrachain-crypto-engine pins =1.0.228; sigra-service builds both).
# Historical note: project setup (db98b15) capped serde <1.0.217 for
# alloy 1.0.22 compatibility; that cap is obsolete at the pinned alloy 1.6.3,
# which is built and tested against 1.0.228 here.
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
hex = "=0.4.3"
thiserror = "=2.0.16"
tracing = "=0.1.44"
chrono = { version = "=0.4.45", features = ["serde"] }
reqwest = { version = "=0.12.28", default-features = false }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["full", "test-util"] }
alloy = { version = "=1.6.3", features = ["full", "node-bindings"] }

[[example]]
name = "basic_usage"
